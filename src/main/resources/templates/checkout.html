<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" >
<head>
    <meta charset="UTF-8">
    <title>Calculation Final Price</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4">Calculation Final Price</h2>

        <form th:action="@{/checkout}" method="post" th:object="${request}">
            <div class="card mb-4">
                <div class="card-header">Products</div>
                <div class="card-body">
                    <div class="form-check" th:each="product : ${products}">
                        <label>
                            <input
                                    class="form-check-input"
                                    type="checkbox"
                                    th:field="*{productIds}"
                                    th:value="${product.id}"
                            >
                        </label>
                        <label class="form-check-label">
                            <span th:text="${product.name}"></span>
                            -
                            <span th:text="${product.price}"></span>
                            THB
                        </label>
                    </div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header">Coupon</div>
                <div class="card-body">
                    <div class="form-check" th:each="coupon : ${coupons}">
                        <label>
                            <input class="form-check-input"
                                type="radio"
                                th:field="*{couponId}"
                                th:value="${coupon.id}">
                        </label>
                        <label class="form-check-label" th:text="${coupon.name}"></label>
                    </div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header">On Top</div>
                <div class="card-body">
                    <div class="form-check" th:each="onTop : ${onTops}">
                        <label>
                            <input class="form-check-input on-top-radio"
                                   type="radio"
                                   th:field="*{onTopId}"
                                   th:value="${onTop.id}"
                                   th:data-type="${onTop.type}">
                        </label>
                        <label class="form-check-label" th:text="${onTop.name}"></label>
                    </div>

                    <div id="pointSection" class="mt-3" style="display:none;">
                        <label>
                            <input class="form-control" type="number" min="0" th:field="*{customerPoint}">
                        </label>
                    </div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header">Seasonal</div>
                <div class="card-body">
                    <div class="form-check" th:each="seasonal : ${seasonals}">
                        <label>
                            <input class="form-check-input"
                                   type="radio"
                                   th:field="*{seasonalId}"
                                   th:value="${seasonal.id}">
                        </label>
                        <label class="form-check-label" th:text="${seasonal.name}"></label>
                    </div>
                </div>
            </div>

            <div class="text-center">
                <button class="btn btn-primary btn-lg">Calculate</button>
            </div>
        </form>
        <div class="container mt-5" th:if="${result != null}">
            <h2>Result</h2>
            <table class="table table-bordered">
                <tr>
                    <th>Subtotal</th>
                    <td th:text="${result.originalTotal} + ' THB'"></td>
                </tr>

                <tr>
                    <th>Coupon Discount</th>
                    <td th:text="${result.couponDiscount} + ' THB'"></td>
                </tr>

                <tr>
                    <th>On Top Discount</th>
                    <td th:text="${result.onTopDiscount} + ' THB'"></td>
                </tr>

                <tr>
                    <th>Seasonal Discount</th>
                    <td th:text="${result.seasonalDiscount + ' THB'}"></td>
                </tr>

                <tr>
                    <th>Total Discount</th>
                    <td th:text="${result.totalDiscount + ' THB'}"></td>
                </tr>

                <tr>
                    <th>Final Price</th>
                    <td th:text="${result.finalPrice + ' THB'}"></td>
                </tr>
            </table>
        </div>
    </div>
</body>
</html>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const radios = document.querySelectorAll(".on-top-radio");
        const pointSection = document.getElementById("pointSection");

        function updatePointInput() {
            const selected = document.querySelector(".on-top-radio:checked");

            if (!selected) {
                pointSection.style.display = "none";
                return;
            }

            if (selected.dataset.type === "POINT") {
                pointSection.style.display = "block";
            } else {
                pointSection.style.display = "none";
                pointSection.querySelector("input").value = "";
            }
        }

        radios.forEach(radio => {
            radio.addEventListener("change", updatePointInput);
        });

        updatePointInput();
    });
</script>
